[package]
name = "fiveplayonlinux"
version = "0.3.0"
edition = "2021"
description = "Native Linux client for Play V2 Fiveplay with dedicated-GPU support"
license = "MIT"

[dependencies]
ash = "0.38.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
